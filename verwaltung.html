<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links verwalten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="management">

  <header class="site-header">
    <div class="header-content">
      <a href="index.html" class="logo">Meine Startseite</a>

      <nav>
        <a href="index.html">Startseite</a>
        <a href="verwaltung.html" class="active">Links verwalten</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Links verwalten</h1>
      <p>Füge neue Links hinzu oder bearbeite deine vorhandenen Einträge.</p>
    </section>

    <section class="form-card">
      <h2 id="form-title">Neuen Link hinzufügen</h2>

      <form id="link-form">
        <label for="link-title">Titel</label>
        <input
          type="text"
          id="link-title"
          placeholder="Zum Beispiel: Google"
          required
        >

        <label for="link-url">Externe URL</label>
        <input
          type="url"
          id="link-url"
          placeholder="https://www.beispiel.de"
          required
        >

        <label for="link-description">Beschreibung</label>
        <textarea
          id="link-description"
          placeholder="Beschreibung des Links..."
          required
        ></textarea>

        <div class="form-buttons">
          <button type="submit" class="button primary-button" id="submit-button">
            Link hinzufügen
          </button>

          <button
            type="button"
            class="button secondary-button"
            id="cancel-button"
            hidden
          >
            Abbrechen
          </button>
        </div>
      </form>
    </section>

    <section class="management-section">
      <h2>Vorhandene Links</h2>
      <div id="management-links" class="management-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
